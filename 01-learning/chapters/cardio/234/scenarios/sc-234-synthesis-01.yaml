# Scénario clinique — synthesis (contrat 09)
# Intègre mécanismes de congestion, triage aigu, facteur déclenchant, SCA associé, phénotype.

scenario_id: sc-234-synthesis-01
kind: synthesis
status: published
title: "OAP sur IC connue — congestion, déclencheur et SCA associé"

kp_refs:
  - KP-006
  - KP-040
  - KP-041
  - KP-042
