      BNP < 100 pg/mL ou NT-proBNP < 300 pg/mL
    score_tier: 1
    claim_facets_label:
      - id: cf-q-234-06-opt-a
        class: sourced
        kp: [KP-036]
    explanation: |
      Seuils de rule-out en dyspnée aiguë retenus par le Collège.
    claim_facets_explanation:
      - id: cf-q-234-06-exp-a
        class: sourced
        kp: [KP-036]
  - id: b
    label: |
      BNP > 1000 pg/mL obligatoirement pour écarter l'IC
    score_tier: 0
    claim_facets_label:
      - id: cf-q-234-06-opt-b
        class: sourced
        kp: [KP-035, KP-036]
    explanation: |
      Inverse la logique : des peptides bas écartent ; des peptides élevés n'écartent pas.
    claim_facets_explanation:
      - id: cf-q-234-06-exp-b
        class: sourced
        kp: [KP-035, KP-036]
  - id: c
    label: |
      NT-proBNP < 3000 pg/mL suffit toujours à écarter l'IC
    score_tier: 0
    claim_facets_label:
      - id: cf-q-234-06-opt-c
        class: sourced
        kp: [KP-036]
    explanation: |
      Seuil incorrect ; le rule-out aigu retient NT-proBNP < 300 pg/mL.
    claim_facets_explanation:
      - id: cf-q-234-06-exp-c
        class: sourced
        kp: [KP-036]
  - id: d
