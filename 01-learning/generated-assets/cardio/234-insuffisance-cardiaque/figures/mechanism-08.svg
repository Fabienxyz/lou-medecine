<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 586" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Mécanisme 8</title>
  <desc id="svg-desc">Diagramme éducatif : IC à fraction d'éjection diminuée ou préservée ?</desc>
  <defs>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9CA3AF"/>
    </marker>
    <style>
      .title-main { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 32px; font-weight: 700; fill: #111827; letter-spacing: -0.02em; }
      .title-sub { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 600; fill: #111827; letter-spacing: -0.01em; }
      .caption { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #6B7280; }
      .card-title { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #111827; }
      .card-title-lg { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #111827; }
      .body { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #6B7280; }
      .body-dark { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #374151; }
      .badge-icon { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; }
      .badge-text { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #374151; }
      .step-num { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #6B7280; }
      .outcome-label { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #111827; }
      .outcome-emoji { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 20px; }
      .summary-title { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #111827; }
      .summary-body { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #374151; }
    </style>
  </defs>
  <rect width="1200" height="586" fill="#FFFFFF"/>
  <text x="600" y="64" text-anchor="middle" class="title-main">Mécanisme 8</text>
  <text x="600" y="98" text-anchor="middle" class="title-sub">IC à fraction d'éjection diminuée ou préservée ?</text>
  <text x="600" y="126" text-anchor="middle" class="caption">Pourquoi distingue-t-on ces deux formes ?</text>
  <line x1="520" y1="142" x2="680" y2="142" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <line x1="600" y1="148" x2="600" y2="168" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="168" x2="900" y2="168" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="168" x2="300" y2="196" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="168" x2="900" y2="196" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g filter="url(#card-shadow)">
    <rect x="160" y="208" width="280" height="108" rx="16" fill="#DCFCE7" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <text x="300" y="238" text-anchor="middle" class="card-title">IC à FE diminuée (≤ 40 %)</text>
  <text x="300" y="266" text-anchor="middle" class="body-dark">Défaut de contraction</text>
  <text x="300" y="288" text-anchor="middle" class="body-dark">VG souvent dilaté</text>
  <g filter="url(#card-shadow)">
    <rect x="760" y="208" width="280" height="108" rx="16" fill="#FDE7C7" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <text x="900" y="238" text-anchor="middle" class="card-title">IC à FE préservée (≥ 50 %)</text>
  <text x="900" y="266" text-anchor="middle" class="body-dark">Défaut de remplissage</text>
  <text x="900" y="288" text-anchor="middle" class="body-dark">Parois épaissies / fibrosées</text>
  <line x1="600" y1="316" x2="600" y2="348" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g filter="url(#card-shadow)">
    <rect x="390" y="364" width="420" height="56" rx="16" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <circle cx="458" cy="394" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="458" y="398" text-anchor="middle" class="step-num">2</text>
  <text x="600" y="394" text-anchor="middle" class="card-title">FE 41–49 % : forme intermédiaire</text>
  <line x1="600" y1="420" x2="600" y2="452" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g filter="url(#card-shadow)">
    <rect x="180" y="452" width="840" height="94" rx="16" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <text x="600" y="488" text-anchor="middle" class="summary-title">À retenir</text>
  <text x="600" y="516" text-anchor="middle" class="summary-body">Deux mécanismes principaux selon la FEVG.</text>
</svg>
