summary:
  bullets:
    - >-
      L'insuffisance cardiaque combine un débit insuffisant (ou une incapacité à
      l'augmenter à l'effort) et des pressions de remplissage élevées transmises en
      amont — deux conséquences qui expliquent le bas débit et la congestion.
    - >-
      Les compensations (Starling, sympathique, rétention hydrosodée, SRAA) maintiennent
      le débit un temps, puis favorisent remodelage et décompensation.
    - >-
      Les phénotypes HFrEF, HFmrEF et HFpEF se distinguent par la fraction d'éjection
      et orientent le raisonnement thérapeutique.
    - >-
      Le diagnostic repose sur la clinique, les peptides natriurétiques (valeur
      prédictive négative) puis l'échocardiographie ; l'ECG guide surtout le traitement.
    - >-
      Le traitement associe les diurétiques de congestion aux quatre classes
      modificatrices de la maladie en HFrEF ; en HFrEF aiguë, trier congestion et
      hypoperfusion avant de traiter la cause.
