# Non-regression gate — golden master Item 234 (PDR-G6, PDR-B2).
# Architecture : docs/testing/TEST_ARCHITECTURE_V1.md — RELEASE gate

name: CI — Fixture 234

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-234-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-234:
    name: RELEASE gate — package 234
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            demo/renderer/package-lock.json
            tools/lou-build/package-lock.json

      - name: RELEASE gate (validate-reader-v1)
        run: ./scripts/validate-reader-v1.sh
        env:
          CI: "true"
