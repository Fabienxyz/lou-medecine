<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1202" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Vue d'ensemble</title>
  <desc id="svg-desc">Schéma éducatif de la progression de l'insuffisance cardiaque, de la cardiopathie aux décompensations et à la prise en charge.</desc>
  <defs>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9CA3AF"/>
    </marker>
    <style>
      .title-main { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 32px; font-weight: 700; fill: #111827; letter-spacing: -0.02em; }
      .title-sub { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 600; fill: #111827; letter-spacing: -0.01em; }
      .caption { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #6B7280; }
      .card-title { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #111827; }
      .card-title-lg { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #111827; }
      .body { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #6B7280; }
      .body-dark { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #374151; }
      .badge-icon { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; }
      .badge-text { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #374151; }
      .step-num { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #6B7280; }
      .outcome-label { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #111827; }
      .outcome-emoji { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 20px; }
      .summary-title { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #111827; }
      .summary-body { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #374151; }
    </style>
  </defs>
  <rect width="1200" height="1202" fill="#FFFFFF"/>
  <text x="600" y="64" text-anchor="middle" class="title-main">Vue d'ensemble</text>
  <text x="600" y="98" text-anchor="middle" class="title-sub">Insuffisance cardiaque</text>
  <text x="600" y="126" text-anchor="middle" class="caption">Modèle mental du chapitre</text>
  <line x1="520" y1="142" x2="680" y2="142" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#card-shadow)">
    <rect x="390" y="160" width="420" height="96" rx="16" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <circle cx="458" cy="190" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="458" y="194" text-anchor="middle" class="step-num">1</text>
  <text x="600" y="190" text-anchor="middle" class="card-title">Cardiopathie sous-jacente</text>
  <text x="600" y="218" text-anchor="middle" class="body">Ischémique, HTA, valvulaire, rythmique…</text>
  <line x1="600" y1="256" x2="600" y2="288" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g filter="url(#card-shadow)">
    <rect x="390" y="288" width="420" height="56" rx="16" fill="#DCFCE7" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <circle cx="458" cy="318" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="458" y="322" text-anchor="middle" class="step-num">2</text>
  <text x="600" y="318" text-anchor="middle" class="card-title">Dysfonctionnement de la pompe cardiaque</text>
  <line x1="600" y1="344" x2="600" y2="376" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="364" x2="600" y2="384" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="384" x2="900" y2="384" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
  <line x1="300" y1="384" x2="300" y2="412" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <line x1="900" y1="384" x2="900" y2="412" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g filter="url(#card-shadow)">
    <rect x="160" y="424" width="280" height="108" rx="16" fill="#DCFCE7" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <text x="300" y="454" text-anchor="middle" class="card-title">Débit insuffisant</text>
  <text x="300" y="482" text-anchor="middle" class="body-dark">Fatigue, confusion</text>
  <text x="300" y="504" text-anchor="middle" class="body-dark">Bas débit</text>
  <g filter="url(#card-shadow)">
    <rect x="760" y="424" width="280" height="108" rx="16" fill="#FDE7C7" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <text x="900" y="454" text-anchor="middle" class="card-title">Pressions de remplissage ↑</text>
  <text x="900" y="482" text-anchor="middle" class="body-dark">Congestion pulmonaire</text>
  <text x="900" y="504" text-anchor="middle" class="body-dark">Stase veineuse</text>
  <line x1="600" y1="532" x2="600" y2="564" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g filter="url(#card-shadow)">
    <rect x="390" y="580" width="420" height="100" rx="16" fill="#FEF3C7" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <circle cx="458" cy="610" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="458" y="614" text-anchor="middle" class="step-num">4</text>
  <text x="600" y="610" text-anchor="middle" class="card-title">Compensations à court terme</text>
  <text x="600" y="638" text-anchor="middle" class="body">Tachycardie, vasoconstriction</text>
  <text x="600" y="660" text-anchor="middle" class="body">Rétention hydrosodée, remodelage</text>
  <line x1="600" y1="680" x2="600" y2="712" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g filter="url(#card-shadow)">
    <rect x="390" y="712" width="420" height="56" rx="16" fill="#FEE2E2" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <circle cx="458" cy="742" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="458" y="746" text-anchor="middle" class="step-num">5</text>
  <text x="600" y="742" text-anchor="middle" class="card-title">Effets délétères à long terme</text>
  <line x1="600" y1="768" x2="600" y2="800" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g filter="url(#card-shadow)">
    <rect x="324" y="800" width="552" height="148" rx="16" fill="#EDF5FF" stroke="#2563EB" stroke-width="2.5"/>
  </g>
  <circle cx="392" cy="830" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="392" y="834" text-anchor="middle" class="step-num">6</text>
  <text x="600" y="830" text-anchor="middle" class="card-title-lg">Symptômes et décompensations aiguës</text>
  <text x="600" y="858" text-anchor="middle" class="body-dark">OAP, poussées, choc cardiogénique</text>
  <text x="600" y="880" text-anchor="middle" class="body-dark">Syndrome clinique visible</text>
  <line x1="600" y1="948" x2="600" y2="980" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g filter="url(#card-shadow)">
    <rect x="390" y="980" width="420" height="56" rx="16" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <circle cx="458" cy="1010" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="458" y="1014" text-anchor="middle" class="step-num">7</text>
  <text x="600" y="1010" text-anchor="middle" class="card-title">Diagnostic → étiologie → traitement → suivi</text>
  <line x1="600" y1="1036" x2="600" y2="1068" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <g filter="url(#card-shadow)">
    <rect x="180" y="1068" width="840" height="94" rx="16" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
  </g>
  <text x="600" y="1104" text-anchor="middle" class="summary-title">À retenir</text>
  <text x="600" y="1132" text-anchor="middle" class="summary-body">Une cardiopathie entraîne une pompe défaillante, des compensations puis des symptômes.</text>
</svg>
