chapter: cardio/234
source_edition: 2024-SFC
inventory_scope: full-chapter
revision: phase-3c-corrected
note: Phase 3C targeted correction from reconciliation-full-v2 misses
  (SEG-061b/c) and anchor-support gaps (KP-076, KP-096, KP-100). OAP slice
  build uses subset KP-040/041/042 only. FE/CCB source conflict preserved —
  see build/inventory-phase3c-corrections.yaml.
kps:
  - label: "Définition physiopathologique de l’IC : incapacité à délivrer un débit
      adapté et/ou à fonctionner avec des pressions de remplissage normales"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > A Définition
        quote: incapacité du cœur à délivrer un débit adapté aux besoins de l’organisme
          et/ou à fonctionner avec des pressions de remplissage normales
    id: KP-001
  - label: "Définition clinique/syndrome ESC 2021 : symptômes ± signes + anomalie
      structure/fonction du cœur → débit insuffisant et/ou pressions
      intracardiaques ↑"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > A Définition
        quote: l’IC est un syndrome défini par l’association de symptômes, de signes
          cliniques
      - edition: 2024-SFC
        section_path: I. Généralités > A Définition
        quote: causés par une anomalie de structure et/ou de fonction du cœur entraînant
          un débit cardiaque insuffisant
    id: KP-002
  - label: "Diagnostic difficile : symptômes non spécifiques, signes peu sensibles ;
      dysfonction asymptomatique possible avant les symptômes"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > A Définition
        quote: les symptômes ne sont pas spécifiques et les signes ne sont pas sensibles
      - edition: 2024-SFC
        section_path: I. Généralités > A Définition
        quote: période plus ou moins longue de dysfonctionnement cardiaque systolique ou
          diastolique asymptomatique
    id: KP-003
  - label: Prévalence IC 1–2 % ; âge moyen du diagnostic 75–80 ans ; prévalence ↑
      avec l’âge alors que l’incidence standardisée tend à ↓
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > B Épidémiologie
        quote: prévalence de l’IC dans la population générale est entre 1 et 2 %
      - edition: 2024-SFC
        section_path: I. Généralités > B Épidémiologie
        quote: âge moyen du diagnostic en Europe se situant entre 75 et 80 ans
      - edition: 2024-SFC
        section_path: I. Généralités > B Épidémiologie
        quote: l’incidence standardisée sur l’âge tend à diminuer
    id: KP-004
  - label: "Formules hémodynamiques : DC = VES × FC ; VES = VTD − VTS ; FE = VES/VTD
      ; VES dépend de précharge, postcharge et contractilité"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 1 Quelques rappels simples
        quote: "Le débit cardiaque (DC) dépend du volume d’éjection systolique
          ventriculaire (VES) et de la fréquence cardiaque (FC) : DC = VES × FC"
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 1 Quelques rappels simples
        quote: FE = VES/VTD = (VTD – VTS)/VTD
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 1 Quelques rappels simples
        quote: Le VES dépend de la précharge
    id: KP-005
  - label: "Deux conséquences principales d’un dysfonctionnement de pompe : ↓ débit
      (ou incapacité à ↑ à l’effort) et ↑ pressions de remplissage transmises en
      amont"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 1 Quelques rappels simples
        quote: Un dysfonctionnement de la pompe cardiaque peut avoir deux conséquences
          principales
    id: KP-006
  - label: Augmentation des pressions de remplissage et transmission de la pression
      télédiastolique VG vers veines et capillaires pulmonaires
    rank: A
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 1 Quelques rappels simples
        quote: augmentation des pressions de remplissage (diastolique)
          intraventriculaires qui se transmettent en amont
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 1 Quelques rappels simples
        quote: cette augmentation de la pression télédiastolique se transmet à
          l’oreillette gauche, puis aux veines pulmonaires, aux capillaires
          pulmonaires
    id: KP-040
    editions:
      - edition: 2024-SFC
        change: new
  - label: "Transmission VD : pressions diastoliques → OD → circulation veineuse
      systémique (stase hépatique et jugulaire)"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 1 Quelques rappels simples
        quote: Au niveau du VD, l’augmentation des pressions diastoliques se transmet à
          l’oreillette droite
    id: KP-007
  - label: Seuil PPC > 25 mmHg → transsudat → OAP cardiogénique
    rank: A
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 1 Quelques rappels simples
        quote: pression capillaire pulmonaire au-delà d’un certain seuil (en général au
          moins > 25 mmHg)
    id: KP-041
    editions:
      - edition: 2024-SFC
        change: new
  - label: OAP lésionnel non cardiogénique → lésions membrane alvéolo-capillaire →
      exsudat
    rank: A
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 1 Quelques rappels simples
        quote: l’œdème pulmonaire lésionnel non cardiogénique est secondaire à des
          lésions de la membrane alvéolo-capillaire
    id: KP-042
    editions:
      - edition: 2024-SFC
        change: new
  - label: "Mécanismes compensateurs : bénéfiques à court terme, délétères à long
      terme"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: bénéfiques à court terme car maintenant le débit cardiaque
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: mais délétères à long terme car contribuant à augmenter le travail
    id: KP-008
  - label: "Remodelage : dilatation/hypertrophie excentrique et hypertrophie
      concentrique (loi de Laplace) ; exemple VTD 100→200 mL / FE 60→30 % / VES
      60 mL conservé ; compensation puis effets délétères"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: Le remodelage cardiaque est défini comme les changements de la géométrie
          des cavités
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: Contrainte = P développée × Rayon de la cavité/Épaisseur de la paroi
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: si un volume télédiastolique passe de 100 à 200 mL lorsque la fraction
          d’éjection ventriculaire gauche chute de 60 à 30 %, on s’aperçoit que
          le volume d’éjection ventriculaire reste conservé à 60 mL
    id: KP-009
  - label: "Loi de Starling : étirement des fibres (précharge) → ↑ inotropie jusqu’à
      une limite de dilatation"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: D’après la loi de Starling, l’étirement des fibres
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: s’accompagne d’une augmentation de l’inotropie du ventricule jusqu’à une
          certaine limite de dilatation
    id: KP-010
  - label: Tachycardie compensatrice sympathique maintenant le DC ; effets délétères
      (travail cardiaque, consommation en O₂)
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: La tachycardie, sous la dépendance de l’activation du système
          sympathique, contribue également à maintenir le débit cardiaque
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: L’effet délétère est une augmentation du travail cardiaque et de la
          consommation en oxygène du cœur
    id: KP-011
  - label: "Compensations extra-cardiaques : vasoconstriction inhomogène, rétention
      hydrosodée, activation neurohormonale (sympathique + SRAA) avec effets
      délétères (travail cardiaque, proarythmie, toxicité catécholamines)"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: La vasoconstriction, en réponse à l’activation du système sympathique et
          du système rénine
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: La rétention hydrosodée, liée à la baisse de la perfusion rénale
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: les plus importants sont le système sympathique et le système rénine –
          angiotensine – aldostérone
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 2 En cas de
          dysfonctionnement cardiaque
        quote: Les effets délétères sont une augmentation du travail cardiaque, des
          effets proarythmiques, des effets toxiques directs des catécholamines
          sur les myocytes
    id: KP-012
  - label: "Désynchronisation cardiaque (ex. BBG) : contraction asynchrone aggravant
      l’IC"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 3 Désynchronisation
        quote: La désynchronisation cardiaque peut aggraver une IC
    id: KP-013
  - label: "IC à FE diminuée : défaut de contraction/éjection ; définie par FE ≤ 40 %"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 4 Insuffisance cardiaque à
          fraction d’éjection diminuée ou préservée
        quote: Elle est définie par une fraction d’éjection ≤ 40 %
    id: KP-014
  - label: "IC à FE préservée : défaut de remplissage ; FE ≥ 50 % ; plus fréquente
      sujet âgé/femme, HTA, obésité"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 4 Insuffisance cardiaque à
          fraction d’éjection diminuée ou préservée
        quote: Cette IC est définie par une FE ≥ 50 %
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 4 Insuffisance cardiaque à
          fraction d’éjection diminuée ou préservée
        quote: plus fréquent chez le sujet âgé et chez la femme, et souvent associé à
          l’HTA et à l’obésité
    id: KP-015
  - label: "IC à FE légèrement diminuée (41–49 %) : se rapproche de l’IC à FE
      diminuée ; distinction surtout thérapeutique"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 4 Insuffisance cardiaque à
          fraction d’éjection diminuée ou préservée
        quote: Lorsque la fraction d’éjection est entre 41 et 49 %, on parle d’IC à FE
          légèrement diminuée
    id: KP-016
  - label: "Fibrillation atriale dans l’IC : favorisée par dilatation atriale ;
      perte de systole atriale → aggravation IC et ↑ risque d’AVC"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 5 Arythmies
        quote: La fibrillation atriale est favorisée par la dilatation de l’atrium
          secondaire à l’augmentation des pressions intracavitaires
    id: KP-017
  - label: "Arythmies ventriculaires graves (TV, FV) : principale cause de mort
      subite → intérêt du DAI"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: I. Généralités > C Physiopathologie > 5 Arythmies
        quote: Les troubles du rythme ventriculaire graves (TV, FV) sont à l’origine de
          la plupart des morts subites
    id: KP-018
  - label: "Dyspnée d’effort (fréquente, peu spécifique) quantifiée par NYHA
      (Tableau 18.1) : I = efforts habituels ; II = efforts importants (≥ 2
      étages) ; III = efforts peu intenses (< 2 étages) ; IV = repos ou efforts
      minimes"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: La dyspnée d’effort, fréquente mais peu spécifique, est souvent
          révélatrice
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: classification de loin la plus utilisée est celle de la New York Heart
          Association (NYHA)
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: Absence de dyspnée, palpitations ou fatigue pour les efforts habituels
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: montée des escaliers (≥ 2 étages)
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: montée des escaliers (< 2 étages)
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: Dyspnée, palpitations ou fatigue permanente de repos ou pour des efforts
          minimes
    id: KP-019
  - label: "Orthopnée et dyspnée paroxystique nocturne : plus spécifiques ; liées à
      la redistribution/↑ pression capillaire"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: L’orthopnée est plus spécifique
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: La dyspnée paroxystique nocturne, également plus spécifique
    id: KP-020
  - label: "Signes respiratoires trompeurs : asthme cardiaque, toux
      d’effort/décubitus, hémoptysies d’hypertension veineuse pulmonaire"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: l’asthme cardiaque est une bradypnée expiratoire avec respiration
          sifflante
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: la toux, lorsqu’elle survient électivement à l’effort ou au décubitus
    id: KP-021
  - label: "OAP comme manifestation : dyspnée aiguë de repos, position assise,
      expectoration mousseuse ; subœdème si crise spontanément résolutive"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: dyspnée aiguë de repos, au cours de l’œdème aigu pulmonaire
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 1 Symptômes respiratoires
        quote: Lorsque la crise est spontanément résolutive, on parle de subœdème
          pulmonaire
    id: KP-022
  - label: "Autres symptômes d’IC : fatigue, prise de poids/œdèmes, faiblesse
      musculaire, palpitations"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 2 Autres symptômes
        quote: d’une fatigue de repos liée à l’hypotension artérielle ou à l’effort
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 2 Autres symptômes
        quote: d’une prise de poids associée à des œdèmes
    id: KP-023
  - label: "Manifestations d’IC sévère/terminale : SAS/Cheyne-Stokes, confusion,
      troubles digestifs"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 2 Autres symptômes
        quote: La prévalence du syndrome d’apnées du sommeil est augmentée dans l’IC
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 2 Autres symptômes
        quote: des troubles digestifs (douleurs abdominales, nausées, vomissements)
    id: KP-024
  - label: "Hépatalgie d’effort ou de repos : pesanteur douloureuse de l’hypocondre
      droit (distension capsulaire)"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > A Signes fonctionnels > 3 Symptômes
          d’insuffisance cardiaque droite
        quote: L’hépatalgie d’effort ou de repos est une pesanteur douloureuse de
          l’hypocondre droit
    id: KP-025
  - label: Signes physiques d’IC souvent pauvres sous traitement ; leur présence
      traduit une gravité (rétention hydrosodée ou bas débit)
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > B Signes physiques
        quote: La présence de signes physiques d’IC est donc un élément de gravité
    id: KP-026
  - label: "Signes cardiaques : choc de pointe dévié, galop B3, éclat du B2,
      souffles d’IM/IT fonctionnels ou valvulopathie organique"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > B Signes physiques
        quote: un bruit de galop protodiastolique (B3)
      - edition: 2024-SFC
        section_path: II. Diagnostic > B Signes physiques
        quote: un éclat du B2 au foyer pulmonaire en cas d’hypertension artérielle
          pulmonaire
    id: KP-027
  - label: "Signes pulmonaires : râles crépitants/sous-crépitants bilatéraux ;
      épanchement pleural transsudatif (protides < 30 g/L)"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > B Signes physiques
        quote: des râles crépitants ou sous-crépitants, qui sont le plus souvent
          bilatéraux
      - edition: 2024-SFC
        section_path: II. Diagnostic > B Signes physiques
        quote: caractère transsudatif de l’épanchement (concentration en protides < 30
          g/L)
    id: KP-028
  - label: "Pression artérielle : PAS < 100 mmHg = facteur de gravité ; OAP
      hypertensif possible avec PA élevée"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > B Signes physiques
        quote: lorsqu’elle est basse (PAS < 100 mmHg), c’est un facteur de gravité
      - edition: 2024-SFC
        section_path: II. Diagnostic > B Signes physiques
        quote: une pression artérielle élevée peut être contemporaine d’une IC, y
          compris au cours d’un OAP (OAP hypertensif)
    id: KP-029
  - label: "Signes périphériques d’IC droite : turgescence jugulaire, reflux
      hépatojugulaire, hépatomégalie, œdèmes déclives, ascite/anasarque"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > B Signes physiques
        quote: "la turgescence jugulaire : dilatation anormale de la veine jugulaire"
      - edition: 2024-SFC
        section_path: II. Diagnostic > B Signes physiques
        quote: "le reflux hépatojugulaire : dilatation anormale de la veine jugulaire
          après compression manuelle du foie"
      - edition: 2024-SFC
        section_path: II. Diagnostic > B Signes physiques
        quote: "les œdèmes périphériques : mous, blancs, indolores, prenant le godet"
    id: KP-030
  - label: "Stade très avancé : pouls alternant, oligurie, cachexie, dyspnée de
      Cheyne-Stokes"
    rank: unknown
    disposition: deferred-to-mastery
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > B Signes physiques
        quote: l’IC peut s’accompagner d’un pouls alternant, d’une oligurie, d’une fonte
          musculaire
    id: KP-031
  - label: ECG peu contributif au diagnostic positif ; BBG (QRS > 120 ms) important
      pour implications thérapeutiques ; peut orienter l’étiologie
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > C Électrocardiogramme
        quote: L’ECG est peu contributif pour le diagnostic d’IC
      - edition: 2024-SFC
        section_path: II. Diagnostic > C Électrocardiogramme
        quote: bloc de branche, en particulier gauche (durée du QRS > 120 ms)
    id: KP-032
  - label: "Radiographie : RCT > 0,5 si cardiomégalie ; absence de cardiomégalie
      n’exclut pas l’IC (notamment FE préservée)"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > D Radiographie thoracique
        quote: le rapport cardiothoracique (RCT) est augmenté (> 0,5)
      - edition: 2024-SFC
        section_path: II. Diagnostic > D Radiographie thoracique
        quote: L’absence de cardiomégalie ne doit pas faire remettre en cause le
          diagnostic d’IC
      - edition: 2024-SFC
        section_path: II. Diagnostic > D Radiographie thoracique
        quote: des formes unilatérales trompeuses peuvent se voir
    id: KP-033
  - label: "Sémiologie radiologique de stase : redistribution vasculaire → lignes B
      de Kerley → œdème alvéolaire « en ailes de papillon » ; épanchements
      pleuraux"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > D Radiographie thoracique
        quote: la redistribution vasculaire de la base vers les sommets
      - edition: 2024-SFC
        section_path: II. Diagnostic > D Radiographie thoracique
        quote: aspect dit « en ailes de papillon »
      - edition: 2024-SFC
        section_path: II. Diagnostic > D Radiographie thoracique
        quote: des formes unilatérales trompeuses peuvent se voir
    id: KP-034
  - label: "BNP/NT-proBNP : libérés lors de l’étirement myocytaire ; recommandés
      pour le diagnostic ; bonne valeur prédictive négative"
    rank: unknown
    disposition: understanding
    anchors:
      - edition: 2024-SFC
        section_path: II. Diagnostic > E Dosage des peptides natriurétiques (BNP ou
          NT-proBNP)
        quote: Le BNP ou le NT-proBNP sont aujourd’hui recommandés pour le diagnostic de
          l’IC, avec une bonne valeur prédictive négative
      - edition: 2024-SFC
        section_path: II. Diagnostic > E Dosage des peptides natriurétiques (BNP ou
          NT-proBNP)
