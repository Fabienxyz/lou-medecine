    score_tier: 0
    claim_facets_label:
      - id: cf-q-234-06-opt-d
        class: sourced
        kp: [KP-035]
    explanation: |
      Au contraire : leur intérêt principal est une bonne VPN.
    claim_facets_explanation:
      - id: cf-q-234-06-exp-d
        class: sourced
        kp: [KP-035]

editorial:
