<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1320" width="1200" height="1320" role="img" aria-labelledby="svg-title svg-desc">
<!--
Lou Learning Companion
Official Diagram Component Library

Version: 1.0
Status: Approved

Based on:
demo/legacy/assets/svg/cardio-221-overview.svg

Author:
Lou Learning Companion

This file defines the reusable graphical language of the Lou Learning Companion.

Future diagrams should reuse these graphical components while composing layouts adapted to each chapter.

Do not modify styles.
Only compose and populate components.
-->
  <title id="svg-title">Lou Learning Companion Diagram Component Library</title>
  <desc id="svg-desc">Reusable graphical component template for Lou Learning Companion diagrams. Each component preserves the visual language of the legacy prototype. Replace placeholder text when composing chapter-specific diagrams.</desc>

  <defs>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9CA3AF"/>
    </marker>
    <style>
      .title-main { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 32px; font-weight: 700; fill: #111827; letter-spacing: -0.02em; }
      .title-sub { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 600; fill: #111827; letter-spacing: -0.01em; }
      .caption { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #6B7280; }
      .card-title { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #111827; }
      .card-title-lg { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 700; fill: #111827; }
      .body { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #6B7280; }
      .body-dark { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #374151; }
      .badge-icon { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; }
      .badge-text { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #374151; }
      .step-num { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #6B7280; }
      .outcome-label { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #111827; }
      .outcome-emoji { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 20px; }
      .summary-title { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #111827; }
      .summary-body { font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 400; fill: #374151; }
    </style>
  </defs>

  <rect width="1200" height="1320" fill="#FFFFFF"/>

  <!-- ====================================================== -->
  <!-- COMPONENTS -->
  <!-- ====================================================== -->

  <!-- ====================================================== -->
  <!-- TITLE -->
  <!-- ====================================================== -->

  <!-- component: title-block -->
  <g id="component-title-block">
    <text x="600" y="64" text-anchor="middle" class="title-main">Chapter title</text>
    <text x="600" y="98" text-anchor="middle" class="title-sub">Diagram subtitle</text>
    <text x="600" y="126" text-anchor="middle" class="caption">Caption</text>
  </g>

  <!-- component: blue-separator -->
  <g id="component-blue-separator">
    <line x1="520" y1="142" x2="680" y2="142" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ====================================================== -->
  <!-- BASIC PRIMITIVES -->
  <!-- ====================================================== -->

  <!-- component: numbered-circle -->
  <g id="component-numbered-circle">
    <circle cx="478" cy="190" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="478" y="194" text-anchor="middle" class="step-num">1</text>
  </g>

  <!-- component: badge -->
  <g id="component-badge">
    <rect x="414" y="214" width="88" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="428" y="237" class="badge-icon">○</text>
    <text x="452" y="237" class="badge-text">Badge</text>
  </g>

  <!-- ====================================================== -->
  <!-- CARDS -->
  <!-- ====================================================== -->

  <!-- component: card-badges -->
  <g id="component-card-badges">
    <g filter="url(#card-shadow)">
      <rect x="390" y="160" width="420" height="112" rx="16" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
    </g>
    <circle cx="478" cy="190" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="478" y="194" text-anchor="middle" class="step-num">1</text>
    <text x="600" y="194" text-anchor="middle" class="card-title">Step title</text>
    <rect x="414" y="214" width="88" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="428" y="237" class="badge-icon">○</text>
    <text x="452" y="237" class="badge-text">Badge</text>
    <rect x="510" y="214" width="88" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="524" y="237" class="badge-icon">○</text>
    <text x="548" y="237" class="badge-text">Badge</text>
    <rect x="606" y="214" width="88" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="620" y="237" class="badge-icon">○</text>
    <text x="644" y="237" class="badge-text">Badge</text>
    <rect x="702" y="214" width="96" height="36" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="716" y="237" class="badge-icon">○</text>
    <text x="740" y="237" class="badge-text">Badge</text>
  </g>

  <!-- component: connector-arrow -->
  <g id="component-connector-arrow">
    <line x1="600" y1="288" x2="600" y2="320" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  </g>

  <!-- component: card-medium -->
  <g id="component-card-medium">
    <g filter="url(#card-shadow)">
      <rect x="390" y="328" width="420" height="96" rx="16" fill="#DCFCE7" stroke="#E5E7EB" stroke-width="1"/>
    </g>
    <circle cx="458" cy="358" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="458" y="362" text-anchor="middle" class="step-num">1</text>
    <text x="600" y="358" text-anchor="middle" class="card-title">Step title</text>
    <text x="600" y="386" text-anchor="middle" class="body">Body text</text>
  </g>

  <line x1="600" y1="432" x2="600" y2="464" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- component: card-small -->
  <g id="component-card-small">
    <g filter="url(#card-shadow)">
      <rect x="390" y="472" width="420" height="56" rx="16" fill="#DCFCE7" stroke="#E5E7EB" stroke-width="1"/>
    </g>
    <circle cx="478" cy="500" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="478" y="504" text-anchor="middle" class="step-num">1</text>
    <text x="600" y="504" text-anchor="middle" class="card-title">Step title</text>
  </g>

  <line x1="600" y1="536" x2="600" y2="568" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- component: card-highlight -->
  <g id="component-card-highlight">
    <g filter="url(#card-shadow)">
      <rect x="324" y="576" width="552" height="148" rx="16" fill="#EDF5FF" stroke="#2563EB" stroke-width="2.5"/>
    </g>
    <circle cx="442" cy="614" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="442" y="618" text-anchor="middle" class="step-num">1</text>
    <text x="600" y="618" text-anchor="middle" class="card-title-lg">Step title</text>
    <text x="600" y="650" text-anchor="middle" class="body-dark">Body text</text>
    <text x="600" y="674" text-anchor="middle" class="body-dark">Body text</text>
    <text x="600" y="698" text-anchor="middle" class="body-dark">Body text</text>
  </g>

  <!-- ====================================================== -->
  <!-- CONNECTORS -->
  <!-- ====================================================== -->

  <!-- component: branch-connector -->
  <g id="component-branch-connector">
    <line x1="600" y1="740" x2="600" y2="760" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <line x1="300" y1="760" x2="900" y2="760" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <line x1="300" y1="760" x2="300" y2="788" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
    <line x1="900" y1="760" x2="900" y2="788" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  </g>

  <!-- component: card-branch-success -->
  <g id="component-card-branch-success">
    <g filter="url(#card-shadow)">
      <rect x="160" y="796" width="280" height="108" rx="16" fill="#DCFCE7" stroke="#E5E7EB" stroke-width="1"/>
    </g>
    <text x="300" y="828" text-anchor="middle" class="card-title">Step title</text>
    <text x="300" y="852" text-anchor="middle" class="body-dark">Body text</text>
    <text x="300" y="872" text-anchor="middle" class="body-dark">Body text</text>
    <text x="300" y="892" text-anchor="middle" class="body-dark">Body text</text>
  </g>

  <!-- component: card-branch-warning -->
  <g id="component-card-branch-warning">
    <g filter="url(#card-shadow)">
      <rect x="760" y="796" width="280" height="108" rx="16" fill="#FDE7C7" stroke="#E5E7EB" stroke-width="1"/>
    </g>
    <circle cx="838" cy="828" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="838" y="832" text-anchor="middle" class="step-num">1</text>
    <text x="900" y="828" text-anchor="middle" class="card-title">Step title</text>
    <text x="900" y="852" text-anchor="middle" class="body-dark">Body text</text>
    <text x="900" y="872" text-anchor="middle" class="body-dark">Body text</text>
    <text x="900" y="892" text-anchor="middle" class="body-dark">Body text</text>
  </g>

  <line x1="900" y1="912" x2="900" y2="944" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- component: card-small-danger -->
  <g id="component-card-small-danger">
    <g filter="url(#card-shadow)">
      <rect x="760" y="952" width="280" height="56" rx="16" fill="#FEE2E2" stroke="#E5E7EB" stroke-width="1"/>
    </g>
    <circle cx="858" cy="980" r="11" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="858" y="984" text-anchor="middle" class="step-num">1</text>
    <text x="900" y="984" text-anchor="middle" class="card-title">Step title</text>
  </g>

  <line x1="900" y1="1016" x2="900" y2="1048" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- ====================================================== -->
  <!-- OUTCOMES -->
  <!-- ====================================================== -->

  <!-- component: outcome-card -->
  <g id="component-outcome-card">
    <g filter="url(#card-shadow)">
      <rect x="760" y="1056" width="280" height="124" rx="16" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
    </g>
    <text x="900" y="1086" text-anchor="middle" class="card-title">Step title</text>
    <g filter="url(#card-shadow)">
      <rect x="780" y="1102" width="120" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    </g>
    <text x="840" y="1128" text-anchor="middle" class="outcome-emoji">○</text>
    <text x="840" y="1152" text-anchor="middle" class="outcome-label">Outcome</text>
    <g filter="url(#card-shadow)">
      <rect x="920" y="1102" width="120" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    </g>
    <text x="980" y="1128" text-anchor="middle" class="outcome-emoji">○</text>
    <text x="980" y="1152" text-anchor="middle" class="outcome-label">Outcome</text>
  </g>

  <!-- ====================================================== -->
  <!-- SUMMARY -->
  <!-- ====================================================== -->

  <!-- component: summary-card -->
  <g id="component-summary-card">
    <g filter="url(#card-shadow)">
      <rect x="180" y="1204" width="840" height="112" rx="16" fill="#F5F7FA" stroke="#E5E7EB" stroke-width="1"/>
    </g>
    <text x="600" y="1240" text-anchor="middle" class="summary-title">Summary</text>
    <text x="600" y="1268" text-anchor="middle" class="summary-body">Body text</text>
    <text x="600" y="1290" text-anchor="middle" class="summary-body">Body text</text>
    <text x="600" y="1312" text-anchor="middle" class="summary-body">Body text</text>
  </g>

</svg>
