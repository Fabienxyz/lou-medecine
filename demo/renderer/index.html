<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lou Learning Companion</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container">

<div class="header">

<span class="badge">Preview</span>

<p class="header-eyebrow">Lou Learning Companion</p>

<h1 id="specialty">…</h1>

<p class="chapter-line" id="chapter-line">…</p>

<p class="chapter-title" id="chapter-title">…</p>

<div class="objectives">
    <p class="objectives-title">À la fin de cette page, tu sauras :</p>
    <ul id="objectives-list">
        <li>…</li>
    </ul>
</div>

<p class="philosophy">Comprendre avant de mémoriser. Une idée à la fois.</p>

<div class="header-meta">
    <div class="meta-item">
        <span class="meta-label">Lecture</span>
        <span class="meta-value" id="read-time">…</span>
    </div>
    <button type="button" id="local-search-trigger" class="local-search-trigger" hidden aria-label="Rechercher dans cette Release" aria-expanded="false" aria-controls="local-search-root">Rechercher</button>
    <div id="display-preferences-root" class="display-preferences-root" hidden aria-label="Préférences d'affichage"></div>
</div>

<div class="progression">
    <p class="progression-title">Progression</p>
    <div class="progression-steps">
        <span class="active">🟢 Comprendre</span>
        <span>⚪ Mémoriser</span>
        <span>⚪ S'entraîner</span>
        <span>⚪ Valider</span>
    </div>
</div>

</div>

<div class="tabs" id="tabs"></div>

<div class="content" id="content"></div>

<div id="local-search-root" class="local-search-root" hidden aria-hidden="true">
    <div class="local-search-panel" role="dialog" aria-modal="true" aria-label="Recherche locale">
        <label class="local-search-label" for="local-search-input">Rechercher dans cette Release</label>
        <input id="local-search-input" class="local-search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Mot-clé (min. 2 caractères)…" />
        <p id="local-search-status" class="local-search-status" data-state="idle" aria-live="polite"></p>
        <ul id="local-search-results" class="local-search-results" role="listbox" hidden></ul>
    </div>
</div>

</div>

<script src="lib/marked.min.js"></script>
<script src="config.js"></script>
<script src="markdown.js"></script>
<script src="learner-patrimony.js"></script>
<script src="learner-store.js"></script>
<script src="learner-snapshot.js"></script>
<script src="session-service.js"></script>
<script src="session-resume.js"></script>
<script src="text-highlights.js"></script>
<script src="caret-anchor.js"></script>
<script src="inline-notes.js"></script>
<script src="svg-loader.js"></script>
<script src="figure-zoom.js"></script>
<script src="inline-formatting.js"></script>
<script src="blocks.js"></script>
<script src="cognitive-priming-render.js"></script>
<script src="renderer.js"></script>
<script type="module" src="composition/bootstrap.mjs"></script>
<script src="search-navigation.js"></script>
<script src="local-search-ui.js"></script>
<script src="display-preferences-apply.js"></script>
<script src="display-preferences-ui.js"></script>
<script defer src="app.js"></script>

</body>
</html>
