    section_path: I. Généralités > A Définition
    evidence: l’IC est un syndrome défini par l’association de symptômes, de signes cliniques …
      dysfonctionnement … débit cardiaque insuffisant et/ou des pressions intracardiaques élevées …
      rétention hydrosodée ; … myocardique, valvulaire, péricardique, ou lié à une anomalie du
      rythme ou de la conduction
    disposition: represented
    kp:
      - KP-002
