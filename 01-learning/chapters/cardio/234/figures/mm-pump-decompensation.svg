    </marker>
    <marker id="vg-arrow-accent" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0.5 L7,3.5 L0,6.5 Z" fill="#2563eb"/>
    </marker>
