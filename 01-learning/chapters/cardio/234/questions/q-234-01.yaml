# Question d'évaluation (contrat 07)
question_id: q-234-01
status: published
score_model: edn_v1

kp_refs:
  - KP-001
  - KP-006
  - KP-015
  - KP-019

element_refs:
  - MEC-output-basics

stem:
  text: |
    Selon la définition physiopathologique du Collège, l'insuffisance cardiaque correspond à :
  claim_facets:
    - id: cf-q-234-01-stem
      class: sourced
      kp: [KP-001]

options:
  - id: a
    label: |
      l'incapacité du cœur à délivrer un débit adapté aux besoins de l'organisme et/ou à fonctionner avec des pressions de remplissage normales
    score_tier: 1
    claim_facets_label:
      - id: cf-q-234-01-opt-a
        class: sourced
        kp: [KP-001]
    explanation: |
      Réponse attendue : définition physiopathologique officielle (débit inadapté et/ou pressions de remplissage anormales).
    claim_facets_explanation:
      - id: cf-q-234-01-exp-a
        class: sourced
        kp: [KP-001]
  - id: b
    label: |
      une FEVG nécessairement inférieure à 40 %
    score_tier: 0
    claim_facets_label:
      - id: cf-q-234-01-opt-b
        class: sourced
        kp: [KP-001, KP-015]
    explanation: |
      Faux : la définition physiopathologique n'impose pas un seuil de FE ; l'HFpEF existe (FE ≥ 50 %).
    claim_facets_explanation:
      - id: cf-q-234-01-exp-b
        class: sourced
        kp: [KP-001, KP-015]
  - id: c
    label: |
      uniquement un bas débit cardiaque au repos
    score_tier: 0.2
    claim_facets_label:
      - id: cf-q-234-01-opt-c
        class: sourced
        kp: [KP-001, KP-006]
    explanation: |
      Incomplet : la définition inclut aussi l'incapacité à augmenter le débit et/ou l'élévation des pressions de remplissage.
    claim_facets_explanation:
      - id: cf-q-234-01-exp-c
        class: sourced
        kp: [KP-001, KP-006]
  - id: d
    label: |
      toute dyspnée d'effort chez le sujet âgé
    score_tier: 0
    claim_facets_label:
      - id: cf-q-234-01-opt-d
        class: sourced
        kp: [KP-019, KP-001]
    explanation: |
      La dyspnée d'effort est peu spécifique et ne définit pas l'IC à elle seule.
    claim_facets_explanation:
      - id: cf-q-234-01-exp-d
        class: sourced
        kp: [KP-019, KP-001]

editorial:
  difficulty: basic
  notes: "Définition physiopathologique"
